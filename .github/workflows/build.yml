name: Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Unzip addon
        run: unzip -q ReachAddon.zip

      - name: Build AUTISM Client API
        run: |
          git clone --depth 1 https://github.com/AutismDevelopment/Autism-Client.git ../Autism-Client
          cd ../Autism-Client
          chmod +x gradlew
          ./gradlew publishToMavenLocal -Prelease --stacktrace

      - name: Build addon
        run: |
          cd ReachAddon
          chmod +x gradlew
          ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: reach-addon-jar
          path: |
            ReachAddon/build/libs/*.jar
            !ReachAddon/build/libs/*-sources.jar
